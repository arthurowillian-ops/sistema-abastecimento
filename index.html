<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Abastecimento - Regional Tubarão</title>
    
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { 
            --bg-body: #f1f5f9; 
            --surface: #ffffff; 
            --primary: #0f172a; 
            --secondary: #475569; 
            --border: #e2e8f0; 
            --shadow-bold: 0 20px 25px -5px rgba(0, 0, 0, 0.1); 
        }
        
        * { box-sizing: border-box; }
        
        body { background-color: var(--bg-body); color: var(--primary); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        .hidden { display: none !important; }
        
        /* Login */
        #login-page { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at top right, #cbd5e1, #f1f5f9); padding: 20px; }
        .login-card { background: var(--surface); padding: 40px 30px; border-radius: 32px; box-shadow: var(--shadow-bold); width: 100%; max-width: 380px; text-align: center; }
        .login-card img { width: 100px; margin-bottom: 10px; }
        .input-box { width: 100%; padding: 14px; margin: 8px 0; border: 1.5px solid var(--border); border-radius: 14px; box-sizing: border-box; outline: none; font-family: inherit; font-size: 15px; }
        .btn-action { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 15px; }
        .btn-action:hover { opacity: 0.9; }
        
        /* Header Responsivo */
        header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); padding: 15px 30px; display: flex; flex-direction: column; gap: 15px; position: sticky; top: 0; z-index: 100; }
        .brand-box { display: flex; align-items: center; gap: 15px; }
        .brand-box img { height: 50px; }
        .brand-box h1 { font-size: 16px; margin: 0; font-weight: 800; }
        
        .nav-links { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
        .nav-links button { background: none; border: none; padding: 10px 16px; color: var(--secondary); cursor: pointer; font-weight: 700; border-radius: 12px; transition: 0.3s; font-size: 13px; flex: 1; min-width: 120px; text-align: center; background-color: #f8fafc; }
        .nav-links button.active { color: var(--surface); background: var(--primary); }
        
        /* Container & Cards */
        .container { max-width: 1300px; margin: 30px auto; padding: 0 20px; }
        .grid-locais { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card-local { background: var(--surface); padding: 30px 15px; border-radius: 24px; text-align: center; border: 1px solid var(--border); transition: all 0.3s ease; cursor: pointer; position: relative; }
        .card-local:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: var(--shadow-bold); }
        .card-local .icon-img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 15px; }
        .status-badge { position: absolute; top: 15px; right: 15px; color: #10b981; font-size: 1.3rem; }
        
        .dash-card, .form-card { background: var(--surface); padding: 25px; border-radius: 24px; border: 1px solid var(--border); margin-bottom: 25px; }
        
        /* Linha de insumo no formulário adaptável */
        .insumo-row { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 15px 0; border-bottom: 1px solid #f1f5f9; align-items: center; }
        .insumo-title { font-weight: 700; font-size: 15px; }
        .insumo-inputs { display: grid; grid-template-columns: 80px 1fr; gap: 10px; }
        
        /* Layout de Gráficos Adaptável */
        .charts-grid { display: grid; grid-template-columns: 1fr; gap: 25px; }
        
        /* CORREÇÃO: Restaurado para display:none padrão. O JS vai controlar a ativação visual correta na hora do print */
        #pdf-container { display: none; padding: 40px; background: white; font-family: sans-serif; }
        
        /* Botão Whatsapp */
        .btn-whatsapp { position: fixed; bottom: 20px; right: 20px; background: #25d366; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3); text-decoration: none; font-size: 1.6rem; z-index: 999; }

        /* Ajustes para telas maiores (Computadores) */
        @media (min-width: 768px) {
            header { flex-direction: row; justify-content: space-between; align-items: center; padding: 15px 60px; }
            .nav-links { width: auto; }
            .nav-links button { flex: none; background: none; font-size: 14px; }
            .nav-links button.active { color: var(--primary); background: #f8fafc; }
            .brand-box h1 { font-size: 18px; }
            .container { margin: 50px auto; padding: 0 30px; }
            .grid-locais { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; }
            .card-local { padding: 45px 25px; }
            .card-local .icon-img { width: 110px; height: 110px; }
            .insumo-row { grid-template-columns: 2fr 1fr 3fr; gap: 20px; padding: 12px 0; }
            .insumo-inputs { display: contents; }
            .charts-grid { grid-template-columns: 1.5fr 1fr; }
            .chart-span-2 { grid-column: span 2; }
            .btn-whatsapp { bottom: 40px; right: 40px; width: 65px; height: 65px; font-size: 2rem; }
        }
        
        .form-header { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        @media (min-width: 500px) {
            .form-header { flex-direction: row; justify-content: space-between; align-items: center; }
        }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-card">
            <img src="https://i.postimg.cc/L6QH7GbZ/Logo-oficial-CCB.png" alt="Logo">
            <h1 style="margin: 0; font-size: 24px; font-weight: 800; color: #0f172a;">ABASTECIMENTO</h1>
            <p style="margin: 5px 0 30px 0; font-size: 12px; color: #64748b; letter-spacing: 2px; font-weight: 600;">SISTEMA DE INSUMOS</p>
            <input type="text" id="user" class="input-box" placeholder="Usuário">
            <input type="password" id="pass" class="input-box" placeholder="Senha">
            <button class="btn-action" onclick="fazerLogin()">ENTRAR</button>
        </div>
    </div>

    <div id="app" class="hidden">
        <header>
            <div class="brand-box">
                <img src="https://i.postimg.cc/L6QH7GbZ/Logo-oficial-CCB.png" alt="Logo">
                <div>
                    <h1>SISTEMA DE ABASTECIMENTO</h1>
                    <small style="color: var(--secondary); font-weight: 600;">Regional Tubarão/SC</small>
                </div>
            </div>
            <nav class="nav-links">
                <button onclick="mudarTab('home')" id="nav-home" class="active">LOCALIDADES</button>
                <button onclick="mudarTab('dash')" id="nav-dash">DASHBOARD</button>
                <button onclick="mudarTab('entrega')" id="nav-entrega">RELATÓRIOS</button>
                <button onclick="location.reload()" style="color: #ef4444; background: #fee2e2;"><i class="fas fa-power-off"></i> SAIR</button>
            </nav>
        </header>

        <div class="container">
            <div id="view-home">
                <div class="form-header">
                    <h2 style="font-weight: 800; font-size: 26px; margin: 0;">Rede de Distribuição</h2>
                    <input type="month" id="input-mes-ref" class="input-box" style="width: 100%; max-width: 200px; margin: 0;" onchange="sincronizarComFirebase()">
                </div>
                <div class="grid-locais" id="grid-unidades"></div>
            </div>

            <div id="view-form" class="hidden">
                <div class="form-header">
                    <h2 id="title-local-form" style="font-weight: 800; margin: 0; font-size: 22px;"></h2>
                    <button onclick="mudarTab('home')" class="btn-action" style="width: auto; padding: 10px 20px; background: #64748b;">VOLTAR</button>
                </div>
                <div class="form-card">
                    <div id="lista-insumos-inputs"></div>
                    <button class="btn-action" style="margin-top: 30px;" onclick="salvarDadosUnidade()">SALVAR REGISTROS</button>
                </div>
            </div>

            <div id="view-dash" class="hidden">
                <div class="form-header">
                    <h2 style="font-weight: 800; font-size: 26px; margin: 0;">Análise Geral</h2>
                    <button class="btn-action" style="width: auto; padding: 12px 25px;" onclick="gerarPDF()">
                        <i class="fas fa-download"></i> RELATÓRIO GERAL
                    </button>
                </div>
                <div class="charts-grid">
                    <div class="dash-card">
                        <h4 style="margin-top:0">Volume por Insumo (Barras)</h4>
                        <canvas id="chartPrincipal"></canvas>
                    </div>
                    <div class="dash-card">
                        <h4 style="margin-top:0">Distribuição de Materiais</h4>
                        <canvas id="chartDonut"></canvas>
                    </div>
                    <div class="dash-card chart-span-2">
                        <h4 style="margin-top:0">Volume Total por Unidade</h4>
                        <canvas id="chartTimeline"></canvas>
                    </div>
                </div>
            </div>

            <div id="view-entrega" class="hidden">
                <h2 style="font-weight: 800; font-size: 26px; margin-bottom: 30px;">Relatório de Entrega</h2>
                <div class="form-card">
                    <label style="font-weight: 700; display: block; margin-bottom: 8px;">Selecione a Unidade:</label>
                    <select id="select-entrega-local" class="input-box"></select>
                    <button class="btn-action" style="margin-top: 20px;" onclick="gerarPDFEntrega()">GERAR RELATÓRIO</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Container do PDF -->
    <div id="pdf-container"></div>
    <a href="https://wa.me/554896712560" class="btn-whatsapp" target="_blank"><i class="fab fa-whatsapp"></i></a>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCkl0Q5qofLsc3ujPvJYAiHzIxEZj4d780",
            authDomain: "sistema-ccb.firebaseapp.com",
            databaseURL: "https://sistema-ccb-default-rtdb.firebaseio.com",
            projectId: "sistema-ccb",
            storageBucket: "sistema-ccb.firebasestorage.app",
            messagingSenderId: "51450822544",
            appId: "1:51450822544:web:8a5214c94ba0710a77fd15"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const listaLocais = [
            "Termas do Gravatal", "Jaguaruna Central", "São Martinho", "Humaitá de Cima", 
            "Humaitá Centro", "Indaial", "Copa 70", "Mato Alto", "Madre", "Várzea das Canoas", 
            "Km 63", "Sertão dos Medeiros", "Bom Pastor", "Guarda Margem Esq", "Fábio Silva", 
            "Caruru", "São Cristóvão", "Capivari de Baixo", "Treze de Maio", "Braço do Norte", 
            "Comasa", "São Martinho Praia Redonda", "Armazém", "Andrino", "São Ludjero", 
            "Orleans", "Guatá", "São Sebastião"
        ];
        
        const listaInsumos = ["Desinfetante", "Perfumado", "Multiuso ox", "Água Sanitária", "Sabonete líquido", "Papel toalha (rolo)", "Papel toalha (interfolha)", "Papel higiênico (rolão)", "Papel higiênico (rolinho)", "Caixa de água copinho", "Caixa de copo descart.", "Álcool", "Saco de lixo (20 L)", "Saco de lixo (50 L)", "Saco de lixo (60 L)", "Saco de lixo (100 L)", "Saco de lixo (150 L)"];
        
        let bancoDadosMensal = {}; 
        let localAtivo = "";
        let refAnterior = null; 

        function codificarChave(chave) {
            return btoa(unescape(encodeURIComponent(chave)))
                .replace(/=/g, "")
                .replace(/\//g, "_")
                .replace(/\+/g, "-");
        }

        function decodificarChave(chaveCodificada) {
            const mapeamento = {};
            listaInsumos.forEach(insumo => {
                mapeamento[codificarChave(insumo)] = insumo;
            });
            return mapeamento[chaveCodificada] || chaveCodificada;
        }

        function fazerLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(u === 'admin' && p === 'admin') { 
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('input-mes-ref').value = new Date().toISOString().slice(0, 7);
                sincronizarComFirebase();
            } else { alert("Acesso negado."); }
        }

        function sincronizarComFirebase() {
            const mesAtivo = document.getElementById('input-mes-ref').value;
            
            if (refAnterior) { refAnterior.off(); }
            refAnterior = database.ref('abastecimento/' + mesAtivo);
            
            refAnterior.on('value', (snapshot) => {
                const dadosRaw = snapshot.val() || {};
                bancoDadosMensal[mesAtivo] = {};
                for (let local in dadosRaw) {
                    bancoDadosMensal[mesAtivo][local] = {};
                    for (let chaveCodificada in dadosRaw[local]) {
                        const chaveOriginal = decodificarChave(chaveCodificada);
                        bancoDadosMensal[mesAtivo][local][chaveOriginal] = dadosRaw[local][chaveCodificada];
                    }
                }
                renderizarGrid();
                if(!document.getElementById('view-dash').classList.contains('hidden')) atualizarGraficos();
            });
        }

        function renderizarGrid() {
            const mesAtivo = document.getElementById('input-mes-ref').value;
            const grid = document.getElementById('grid-unidades');
            const selectEntrega = document.getElementById('select-entrega-local');
            grid.innerHTML = "";
            
            selectEntrega.innerHTML = `
                <option value=''>Escolha uma unidade...</option>
                <option value='TODOS'>-- GERAR TODOS AS LOCALIDADES --</option>
            `;

            listaLocais.sort().forEach(nome => {
                const temDados = bancoDadosMensal[mesAtivo]?.[nome] && Object.keys(bancoDadosMensal[mesAtivo][nome]).length > 0;
                grid.innerHTML += `
                    <div class="card-local" onclick="abrirFormulario('${nome}')">
                        <img src="https://i.postimg.cc/8cG6K4H8/image-removebg-preview-(4).png" class="icon-img" alt="Igreja">
                        <strong style="display:block; font-size:15px;">${nome}</strong>
                        <div class="status-badge" style="${temDados ? '' : 'display:none'}"><i class="fas fa-check-circle"></i></div>
                    </div>`;
                selectEntrega.innerHTML += `<option value="${nome}">${nome}</option>`;
            });

            const formList = document.getElementById('lista-insumos-inputs');
            if(formList.innerHTML === "") {
                listaInsumos.forEach(item => {
                    const idSeguro = codificarChave(item);
                    formList.innerHTML += `
                        <div class="insumo-row">
                            <span class="insumo-title">${item}</span>
                            <div class="insumo-inputs">
                                <input type="number" class="input-box" style="margin:0; text-align:center" id="qtd-${idSeguro}" placeholder="0">
                                <input type="text" class="input-box" style="margin:0;" id="obs-${idSeguro}" placeholder="Obs...">
                            </div>
                        </div>`;
                });
            }
        }

        function abrirFormulario(nome) {
            localAtivo = nome;
            const mesAtivo = document.getElementById('input-mes-ref').value;
            document.getElementById('title-local-form').innerText = `${nome} (${mesAtivo})`;
            const dadosLocal = bancoDadosMensal[mesAtivo]?.[nome] || {};
            listaInsumos.forEach(item => {
                const idSeguro = codificarChave(item);
                document.getElementById('qtd-'+idSeguro).value = dadosLocal[item]?.q || "";
                document.getElementById('obs-'+idSeguro).value = dadosLocal[item]?.o || "";
            });
            mudarTab('form');
        }

        function salvarDadosUnidade() {
            const mesAtivo = document.getElementById('input-mes-ref').value;
            let dadosParaSalvar = {};
            listaInsumos.forEach(item => {
                const idSeguro = codificarChave(item);
                const q = parseInt(document.getElementById('qtd-'+idSeguro).value) || 0;
                const o = document.getElementById('obs-'+idSeguro).value;
                if(q > 0) {
                    dadosParaSalvar[idSeguro] = {q, o};
                }
            });
            
            database.ref(`abastecimento/${mesAtivo}/${localAtivo}`).set(dadosParaSalvar)
                .then(() => mudarTab('home'))
                .catch((error) => {
                    console.error("Erro ao salvar:", error);
                    alert("Não foi possível salvar os registros. Verifique sua conexão com a internet.");
                });
        }

        function mudarTab(nome) {
            ['home', 'form', 'dash', 'entrega'].forEach(v => {
                document.getElementById('view-'+v).classList.toggle('hidden', v !== nome);
                if(document.getElementById('nav-'+v)) document.getElementById('nav-'+v).classList.toggle('active', v === nome);
            });
            if(nome === 'dash') setTimeout(atualizarGraficos, 100);
        }

        function atualizarGraficos() {
            const mesAtivo = document.getElementById('input-mes-ref').value;
            const dadosMes = bancoDadosMensal[mesAtivo] || {};
            
            const totaisInsumos = {}; 
            const volumePorLocal = {};
            listaInsumos.forEach(i => totaisInsumos[i] = 0);
            listaLocais.forEach(l => volumePorLocal[l] = 0);

            for(let l in dadosMes) {
                for(let i in dadosMes[l]) {
                    if(totaisInsumos[i] !== undefined) totaisInsumos[i] += (dadosMes[l][i].q || 0);
                    if(volumePorLocal[l] !== undefined) volumePorLocal[l] += (dadosMes[l][i].q || 0);
                }
            }

            const activeInsumos = listaInsumos.filter(i => totaisInsumos[i] > 0);
            const cores = ['#0f172a', '#1e293b', '#334155', '#475569', '#64748b', '#94a3b8', '#cbd5e1'];

            if(window.ch1) window.ch1.destroy();
            window.ch1 = new Chart(document.getElementById('chartPrincipal'), {
                type: 'bar', 
                data: { labels: activeInsumos, datasets: [{ data: activeInsumos.map(i => totaisInsumos[i]), backgroundColor: '#0f172a', borderRadius: 8 }] },
                options: { indexAxis: 'y', plugins: { legend: { display: false } }, responsive: true }
            });

            if(window.ch2) window.ch2.destroy();
            window.ch2 = new Chart(document.getElementById('chartDonut'), {
                type: 'doughnut',
                data: { 
                    labels: activeInsumos, 
                    datasets: [{ data: activeInsumos.map(i => totaisInsumos[i]), backgroundColor: cores, borderWidth: 2 }] 
                },
                options: { cutout: '65%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } }, responsive: true }
            });

            if(window.ch3) window.ch3.destroy();
            const labelsLocais = listaLocais.filter(l => volumePorLocal[l] > 0);
            window.ch3 = new Chart(document.getElementById('chartTimeline'), {
                type: 'line',
                data: { 
                    labels: labelsLocais, 
                    datasets: [{ label: 'Volume Total', data: labelsLocais.map(l => volumePorLocal[l]), borderColor: '#0f172a', backgroundColor: 'rgba(15, 23, 42, 0.1)', fill: true, tension: 0.4 }] 
                },
                options: { responsive: true }
            });
        }

        // CORREÇÃO: Funções de PDF reestruturadas para exibição em bloco antes da captura
        function gerarPDF() {
            const mesAtivo = document.getElementById('input-mes-ref').value;
            const dadosMes = bancoDadosMensal[mesAtivo] || {};
            let html = `<div style="text-align:center; padding: 20px;">
                <img src="https://i.postimg.cc/L6QH7GbZ/Logo-oficial-CCB.png" width="70">
                <h2 style="margin:10px 0 0 0;">CONGREGAÇÃO CRISTÃ NO BRASIL</h2>
                <h3 style="margin:5px 0 20px 0; color:#475569;">Relatório Geral de Insumos - ${mesAtivo}</h3>
            </div>`;
            
            listaInsumos.forEach(item => {
                let itemTotal = 0; 
                let table = `<table border="1" style="width:100%; border-collapse:collapse; margin-bottom:20px; font-size:12px;">
                    <tr style="background:#f8fafc;">
                        <th style="padding:8px; text-align:left;">Unidade</th>
                        <th style="padding:8px; width:80px;">Qtd</th>
                        <th style="padding:8px; text-align:left;">Observação</th>
                    </tr>`;
                let has = false;
                for(let loc in dadosMes) { 
                    if(dadosMes[loc][item]) { 
                        table += `<tr>
                            <td style="padding:8px;">${loc}</td>
                            <td style="padding:8px;" align="center">${dadosMes[loc][item].q}</td>
                            <td style="padding:8px;">${dadosMes[loc][item].o}</td>
                        </tr>`; 
                        itemTotal += dadosMes[loc][item].q; has = true; 
                    } 
                }
                if(has) html += `<div style="background:#0f172a; color:white; padding:5px 12px; font-weight:bold; margin-top:20px;">${item.toUpperCase()} (TOTAL: ${itemTotal})</div>` + table + `</table>`;
            });
            
            const container = document.getElementById('pdf-container');
            container.innerHTML = html; 
            container.style.display = 'block'; // Torna visível para o renderizador calcular as dimensões

            html2pdf().from(container).set({ 
                margin: 10, 
                filename: `Geral_${mesAtivo}.pdf`, 
                image: { type: 'jpeg', quality: 0.98 } 
            }).save().then(() => { 
                container.style.display = 'none'; // Esconde novamente
                container.innerHTML = ""; 
            });
        }

        function gerarPDFEntrega() {
            const localSemicol = document.getElementById('select-entrega-local').value;
            const mes = document.getElementById('input-mes-ref').value;
            if(!localSemicol) {
                alert("Por favor, selecione uma localidade ou a opção TODOS.");
                return;
            }

            const container = document.getElementById('pdf-container');
            container.innerHTML = ""; 

            function montarHtmlLocal(nomeLocal, dadosLocal) {
                let htmlTemplate = `
                    <div style="border: 2px solid #0f172a; padding: 30px; border-radius: 10px; background: white; margin-bottom: 30px; page-break-after: always;">
                        <div style="text-align:center; border-bottom: 2px solid #0f172a; padding-bottom: 20px; margin-bottom: 30px;">
                            <img src="https://i.postimg.cc/L6QH7GbZ/Logo-oficial-CCB.png" width="80">
                            <h1 style="margin:15px 0 5px 0; font-size:22px;">CONGREGAÇÃO CRISTÃ NO BRASIL</h1>
                            <h2 style="margin:0; font-size:18px; color: #475569;">RELATÓRIO DE ENTREGA DE INSUMOS</h2>
                        </div>
                        
                        <div style="margin-bottom: 30px; display: flex; justify-content: space-between;">
                            <span><strong>UNIDADE:</strong> ${nomeLocal.toUpperCase()}</span>
                            <span><strong>MÊS:</strong> ${mes}</span>
                        </div>

                        <table border="1" style="width:100%; border-collapse:collapse; margin-bottom: 40px;">
                            <tr style="background:#0f172a; color:white;">
                                <th style="padding:12px; text-align:left;">DESCRIÇÃO DO ITEM</th>
                                <th style="padding:12px; width:100px;">QUANT.</th>
                                <th style="padding:12px; text-align:left;">OBSERVAÇÃO</th>
                            </tr>`;

                let itensInclusos = 0;
                listaInsumos.forEach(item => { 
                    if(dadosLocal[item]) { 
                        htmlTemplate += `<tr>
                            <td style="padding:12px;">${item}</td>
                            <td style="padding:12px;" align="center"><strong>${dadosLocal[item].q}</strong></td>
                            <td style="padding:12px; font-size:11px;">${dadosLocal[item].o}</td>
                        </tr>`; 
                        itensInclusos++; 
                    } 
                });

                htmlTemplate += `</table>
                        <div style="margin-top:80px; display:flex; justify-content: space-around; text-align:center;">
                            <div style="width:250px; border-top: 1px solid #000; padding-top:10px;">Assinatura Responsável</div>
                            <div style="width:250px; border-top: 1px solid #000; padding-top:10px;">Data da Entrega</div>
                        </div>
                    </div>`;

                return itensInclusos > 0 ? htmlTemplate : "";
            }

            let htmlFinal = "";

            if (localSemicol === "TODOS") {
                const dadosMes = bancoDadosMensal[mes] || {};
                const locaisOrdenados = Object.keys(dadosMes).sort();

                locaisOrdenados.forEach(nomeUnidade => {
                    const dadosUnidade = dadosMes[nomeUnidade];
                    if (dadosUnidade) {
                        htmlFinal += montarHtmlLocal(nomeUnidade, dadosUnidade);
                    }
                });

                if(htmlFinal === "") {
                    alert("Nenhum dado registrado em nenhuma unidade para este mês.");
                    return;
                }
                
                container.innerHTML = htmlFinal;
                container.style.display = 'block';
                
                html2pdf().from(container).set({ 
                    margin: 15, 
                    filename: `Entregas_Todas_Unidades_${mes}.pdf`,
                    pagebreak: { mode: 'css' }
                }).save().then(() => { 
                    container.style.display = 'none';
                    container.innerHTML = ""; 
                });

            } else {
                const dados = bancoDadosMensal[mes]?.[localSemicol] || {};
                htmlFinal = montarHtmlLocal(localSemicol, dados);
                
                if(htmlFinal === "") {
                    alert("Nenhum dado registrado para esta unidade.");
                    return;
                }
                
                container.innerHTML = htmlFinal;
                container.style.display = 'block';
                
                html2pdf().from(container).set({ 
                    margin: 15, 
                    filename: `Entrega_${localSemicol}_${mes}.pdf` 
                }).save().then(() => { 
                    container.style.display = 'none';
                    container.innerHTML = ""; 
                });
            }
        }
    </script>
</body>
</html>
