<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Abastecimento - Regional Tubarão</title>
    
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --bg-body: #f1f5f9; --surface: #ffffff; --primary: #0f172a; --secondary: #475569; --border: #e2e8f0; --shadow-bold: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        body { background-color: var(--bg-body); color: var(--primary); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        .hidden { display: none !important; }
        
        /* Login */
        #login-page { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at top right, #cbd5e1, #f1f5f9); }
        .login-card { background: var(--surface); padding: 60px 40px; border-radius: 32px; box-shadow: var(--shadow-bold); width: 100%; max-width: 380px; text-align: center; }
        .login-card img { width: 120px; margin-bottom: 10px; }
        .input-box { width: 100%; padding: 16px; margin: 12px 0; border: 1.5px solid var(--border); border-radius: 14px; box-sizing: border-box; outline: none; font-family: inherit; }
        .btn-action { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        
        /* Header */
        header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); padding: 15px 60px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .brand-box { display: flex; align-items: center; gap: 20px; }
        .brand-box img { height: 65px; }
        .nav-links { display: flex; align-items: center; }
        .nav-links button { background: none; border: none; padding: 12px 24px; color: var(--secondary); cursor: pointer; font-weight: 700; border-radius: 12px; transition: 0.3s; }
        .nav-links button.active { color: var(--primary); background: #f8fafc; }
        
        /* Container & Cards */
        .container { max-width: 1300px; margin: 50px auto; padding: 0 30px; }
        .grid-locais { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; }
        .card-local { background: var(--surface); padding: 45px 25px; border-radius: 28px; text-align: center; border: 1px solid var(--border); transition: all 0.4s ease; cursor: pointer; position: relative; }
        .card-local:hover { border-color: var(--primary); transform: translateY(-8px); box-shadow: var(--shadow-bold); }
        .card-local .icon-img { width: 120px; height: 120px; object-fit: contain; margin-bottom: 25px; }
        .status-badge { position: absolute; top: 20px; right: 20px; color: #10b981; font-size: 1.6rem; }
        .dash-card, .form-card { background: var(--surface); padding: 35px; border-radius: 28px; border: 1px solid var(--border); margin-bottom: 30px; }
        .btn-whatsapp { position: fixed; bottom: 40px; right: 40px; background: #25d366; color: white; width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 15px 30px rgba(37, 211, 102, 0.4); text-decoration: none; font-size: 2rem; }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-card">
            <img src="https://i.postimg.cc/L6QH7GbZ/Logo-oficial-CCB.png">
            <h1 style="margin: 0; font-size: 24px; font-weight: 800; color: #0f172a;">ABASTECIMENTO</h1>
            <p style="margin: 5px 0 30px 0; font-size: 12px; color: #64748b; letter-spacing: 2px; font-weight: 600;">SISTEMA DE INSUMOS</p>
            <input type="text" id="user" class="input-box" placeholder="Usuário">
            <input type="password" id="pass" class="input-box" placeholder="Senha">
            <button class="btn-action" onclick="fazerLogin()">ENTRAR</button>
        </div>
    </div>

    <div id="app" class="hidden">
        <header>
            <div class="brand-box">
                <img src="https://i.postimg.cc/L6QH7GbZ/Logo-oficial-CCB.png">
                <div>
                    <h1 style="font-size: 18px; margin: 0; font-weight: 800;">SISTEMA DE ABASTECIMENTO DE INSUMOS</h1>
                    <small style="color: var(--secondary); font-weight: 600;">Regional Tubarão/SC</small>
                </div>
            </div>
            <nav class="nav-links">
                <button onclick="mudarTab('home')" id="nav-home" class="active">LOCALIDADES</button>
                <button onclick="mudarTab('dash')" id="nav-dash">DASHBOARD</button>
                <button onclick="mudarTab('entrega')" id="nav-entrega">RELATÓRIO DE ENTREGA</button>
                <button onclick="location.reload()" style="color: #ef4444; margin-left: 10px;"><i class="fas fa-power-off"></i> SAIR</button>
            </nav>
        </header>

        <div class="container">
            <div id="view-home">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
                    <h2 style="font-weight: 800; font-size: 28px; margin: 0;">Rede de Distribuição</h2>
                    <input type="month" id="input-mes-ref" class="input-box" style="width: auto;" onchange="sincronizarComFirebase()">
                </div>
                <div class="grid-locais" id="grid-unidades"></div>
            </div>

            <div id="view-form" class="hidden">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                    <h2 id="title-local-form" style="font-weight: 800;"></h2>
                    <button onclick="mudarTab('home')" class="nav-links">VOLTAR</button>
                </div>
                <div class="form-card">
                    <div id="lista-insumos-inputs"></div>
                    <button class="btn-action" style="margin-top: 40px;" onclick="salvarDadosUnidade()">SALVAR REGISTROS</button>
                </div>
            </div>

            <div id="view-dash" class="hidden">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
                    <h2 style="font-weight: 800; font-size: 28px;">Análise Geral</h2>
                    <button class="btn-action" style="width: auto; padding: 12px 30px;" onclick="gerarPDF()">
                        <i class="fas fa-download"></i> BAIXAR RELATÓRIO GERAL
                    </button>
                </div>
                <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px;">
                    <div class="dash-card">
                        <h4 style="margin-top:0">Volume por Insumo (Barras)</h4>
                        <canvas id="chartPrincipal"></canvas>
                    </div>
                    <div class="dash-card">
                        <h4 style="margin-top:0">Distribuição de Materiais</h4>
                        <canvas id="chartDonut"></canvas>
                    </div>
                    <div class="dash-card" style="grid-column: span 2;">
                        <h4 style="margin-top:0">Volume Total por Unidade</h4>
                        <canvas id="chartTimeline"></canvas>
                    </div>
                </div>
            </div>

            <div id="view-entrega" class="hidden">
                <h2 style="font-weight: 800; font-size: 28px; margin-bottom: 40px;">Relatório de Entrega Individual</h2>
                <div class="form-card">
                    <select id="select-entrega-local" class="input-box"></select>
                    <button class="btn-action" style="margin-top: 20px;" onclick="gerarPDFEntrega()">GERAR RELATÓRIO DE ENTREGA</button>
                </div>
            </div>
        </div>
    </div>

    <div id="pdf-container" style="display:none; padding: 40px; background: white;"></div>
    <a href="https://wa.me/554896712560" class="btn-whatsapp" target="_blank"><i class="fab fa-whatsapp"></i></a>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCkl0Q5qofLsc3ujPvJYAiHzIxEZj4d780",
            authDomain: "sistema-ccb.firebaseapp.com",
            databaseURL: "https://sistema-ccb-default-rtdb.firebaseio.com",
            projectId: "sistema-ccb",
            storageBucket: "sistema-ccb.firebasestorage.app",
            messagingSenderId: "51450822544",
            appId: "1:51450822544:web:8a5214c94ba0710a77fd15"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const listaLocais = ["Termas do Gravatal", "Jaguaruna Central", "São Martinho", "Humaitá de Cima", "Humaitá Centro", "Indaial", "Copa 70", "Mato Alto", "Madre", "Várzea das Canoas", "Km 63", "Sertão dos Medeiros", "Bom Pastor", "Guarda Margem Esq.", "Fábio Silva", "Caruru", "São Cristóvão", "Capivari de Baixo", "Treze de Maio", "Braço do Norte", "Comasa"];
        const listaInsumos = ["Desinfetante", "Perfumado", "Multiuso ox", "Água Sanitária", "Sabonete líquido", "Papel toalha (rolo)", "Papel toalha (interfolha)", "Papel higiênico (rolão)", "Papel higiênico (rolinho)", "Caixa de água copinho", "Caixa de copo descart.", "Álcool", "Saco de lixo (20 L)", "Saco de lixo (50 L)", "Saco de lixo (60 L)", "Saco de lixo (100 L)", "Saco de lixo (150 L)"];
        
        let bancoDadosMensal = {}; 
        let localAtivo = "";

        function fazerLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(u === 'admin' && p === 'admin') {
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('input-mes-ref').value = new Date().toISOString().slice(0, 7);
                sincronizarComFirebase();
            } else { alert("Acesso negado."); }
        }

        function sincronizarComFirebase() {
            const mesAtivo = document.getElementById('input-mes-ref').value;
            database.ref('abastecimento/' + mesAtivo).on('value', (snapshot) => {
                bancoDadosMensal[mesAtivo] = snapshot.val() || {};
                renderizarGrid();
                if(!document.getElementById('view-dash').classList.contains('hidden')) atualizarGraficos();
            });
        }

        function renderizarGrid() {
            const mesAtivo = document.getElementById('input-mes-ref').value;
            const grid = document.getElementById('grid-unidades');
            const selectEntrega = document.getElementById('select-entrega-local');
            grid.innerHTML = "";
            selectEntrega.innerHTML = "<option value=''>Escolha uma unidade...</option>";

            listaLocais.sort().forEach(nome => {
                const temDados = bancoDadosMensal[mesAtivo]?.[nome];
                grid.innerHTML += `
                    <div class="card-local" onclick="abrirFormulario('${nome}')">
                        <img src="https://i.postimg.cc/8cG6K4H8/image-removebg-preview-(4).png" class="icon-img">
                        <strong style="display:block; font-size:16px;">${nome}</strong>
                        <div class="status-badge" style="${temDados ? '' : 'display:none'}"><i class="fas fa-check-circle"></i></div>
                    </div>`;
                selectEntrega.innerHTML += `<option value="${nome}">${nome}</option>`;
            });

            const formList = document.getElementById('lista-insumos-inputs');
            if(formList.innerHTML === "") {
                listaInsumos.forEach(item => {
                    formList.innerHTML += `
                        <div style="display: grid; grid-template-columns: 2fr 1fr 3fr; gap: 20px; padding: 12px 0; border-bottom: 1px solid #f1f5f9; align-items: center;">
                            <span style="font-weight: 700;">${item}</span>
                            <input type="number" class="input-box" style="margin:0; text-align:center" id="qtd-${item}" placeholder="0">
                            <input type="text" class="input-box" style="margin:0;" id="obs-${item}" placeholder="Obs...">
                        </div>`;
                });
            }
        }

        function abrirFormulario(nome) {
            localAtivo = nome;
            const mesAtivo = document.getElementById('input-mes-ref').value;
            document.getElementById('title-local-form').innerText = `${nome} (${mesAtivo})`;
            const dadosLocal = bancoDadosMensal[mesAtivo]?.[nome] || {};
            listaInsumos.forEach(item => {
                document.getElementById('qtd-'+item).value = dadosLocal[item]?.q || "";
                document.getElementById('obs-'+item).value = dadosLocal[item]?.o || "";
            });
            mudarTab('form');
        }

        function salvarDadosUnidade() {
            const mesAtivo = document.getElementById('input-mes-ref').value;
            let dadosParaSalvar = {};
            listaInsumos.forEach(item => {
                const q = parseInt(document.getElementById('qtd-'+item).value) || 0;
                const o = document.getElementById('obs-'+item).value;
                if(q > 0) dadosParaSalvar[item] = {q, o};
            });
            database.ref(`abastecimento/${mesAtivo}/${localAtivo}`).set(dadosParaSalvar).then(() => mudarTab('home'));
        }

        function mudarTab(nome) {
            ['home', 'form', 'dash', 'entrega'].forEach(v => {
                document.getElementById('view-'+v).classList.toggle('hidden', v !== nome);
                if(document.getElementById('nav-'+v)) document.getElementById('nav-'+v).classList.toggle('active', v === nome);
            });
            if(nome === 'dash') setTimeout(atualizarGraficos, 100);
        }

        function atualizarGraficos() {
            const mesAtivo = document.getElementById('input-mes-ref').value;
            const dadosMes = bancoDadosMensal[mesAtivo] || {};
            
            const totaisInsumos = {}; 
            const volumePorLocal = {};
            listaInsumos.forEach(i => totaisInsumos[i] = 0);
            listaLocais.forEach(l => volumePorLocal[l] = 0);

            for(let l in dadosMes) {
                for(let i in dadosMes[l]) {
                    totaisInsumos[i] += (dadosMes[l][i].q || 0);
                    volumePorLocal[l] += (dadosMes[l][i].q || 0);
                }
            }

            const activeInsumos = listaInsumos.filter(i => totaisInsumos[i] > 0);
            const cores = ['#0f172a', '#1e293b', '#334155', '#475569', '#64748b', '#94a3b8', '#cbd5e1'];

            // 1. Barras
            if(window.ch1) window.ch1.destroy();
            window.ch1 = new Chart(document.getElementById('chartPrincipal'), {
                type: 'bar', 
                data: { labels: activeInsumos, datasets: [{ data: activeInsumos.map(i => totaisInsumos[i]), backgroundColor: '#0f172a', borderRadius: 8 }] },
                options: { indexAxis: 'y', plugins: { legend: { display: false } } }
            });

            // 2. Rosca (Por Material)
            if(window.ch2) window.ch2.destroy();
            window.ch2 = new Chart(document.getElementById('chartDonut'), {
                type: 'doughnut',
                data: { 
                    labels: activeInsumos, 
                    datasets: [{ data: activeInsumos.map(i => totaisInsumos[i]), backgroundColor: cores, borderWidth: 2 }] 
                },
                options: { cutout: '65%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } }
            });

            // 3. Linha (Por Unidade)
            if(window.ch3) window.ch3.destroy();
            const labelsLocais = listaLocais.filter(l => volumePorLocal[l] > 0);
            window.ch3 = new Chart(document.getElementById('chartTimeline'), {
                type: 'line',
                data: { 
                    labels: labelsLocais, 
                    datasets: [{ label: 'Volume Total', data: labelsLocais.map(l => volumePorLocal[l]), borderColor: '#0f172a', backgroundColor: 'rgba(15, 23, 42, 0.1)', fill: true, tension: 0.4 }] 
                }
            });
        }

        function gerarPDF() {
            const mesAtivo = document.getElementById('input-mes-ref').value;
            const dadosMes = bancoDadosMensal[mesAtivo] || {};
            let html = `<div style="text-align:center; font-family: sans-serif;">
                <img src="https://i.postimg.cc/L6QH7GbZ/Logo-oficial-CCB.png" width="70">
                <h2 style="margin:10px 0 0 0;">CONGREGAÇÃO CRISTÃ NO BRASIL</h2>
                <h3 style="margin:5px 0 20px 0; color:#475569;">Relatório Geral de Insumos - ${mesAtivo}</h3>
            </div>`;
            
            listaInsumos.forEach(item => {
                let itemTotal = 0; 
                let table = `<table border="1" style="width:100%; border-collapse:collapse; margin-bottom:20px; font-size:12px;">
                    <tr style="background:#f8fafc;">
                        <th style="padding:8px; text-align:left;">Unidade</th>
                        <th style="padding:8px; width:80px;">Qtd</th>
                        <th style="padding:8px; text-align:left;">Observação</th>
                    </tr>`;
                let has = false;
                for(let loc in dadosMes) { 
                    if(dadosMes[loc][item]) { 
                        table += `<tr>
                            <td style="padding:8px;">${loc}</td>
                            <td style="padding:8px;" align="center">${dadosMes[loc][item].q}</td>
                            <td style="padding:8px;">${dadosMes[loc][item].o}</td>
                        </tr>`; 
                        itemTotal += dadosMes[loc][item].q; has = true; 
                    } 
                }
                if(has) html += `<div style="background:#0f172a; color:white; padding:5px 12px; font-weight:bold; margin-top:20px;">${item.toUpperCase()} (TOTAL: ${itemTotal})</div>` + table + `</table>`;
            });
            const container = document.getElementById('pdf-container');
            container.innerHTML = html; container.style.display = 'block';
            html2pdf().from(container).set({ margin: 10, filename: `Geral_${mesAtivo}.pdf`, image: { type: 'jpeg', quality: 0.98 } }).save().then(() => container.style.display='none');
        }

        function gerarPDFEntrega() {
            const local = document.getElementById('select-entrega-local').value;
            const mes = document.getElementById('input-mes-ref').value;
            if(!local) return;
            const dados = bancoDadosMensal[mes]?.[local] || {};
            let html = `
                <div style="font-family: sans-serif; border: 2px solid #0f172a; padding: 30px; border-radius: 10px;">
                    <div style="text-align:center; border-bottom: 2px solid #0f172a; padding-bottom: 20px; margin-bottom: 30px;">
                        <img src="https://i.postimg.cc/L6QH7GbZ/Logo-oficial-CCB.png" width="80">
                        <h1 style="margin:15px 0 5px 0; font-size:22px;">CONGREGAÇÃO CRISTÃ NO BRASIL</h1>
                        <h2 style="margin:0; font-size:18px; color: #475569;">RELATÓRIO DE ENTREGA DE INSUMOS</h2>
                    </div>
                    
                    <div style="margin-bottom: 30px; display: flex; justify-content: space-between;">
                        <span><strong>UNIDADE:</strong> ${local.toUpperCase()}</span>
                        <span><strong>MÊS:</strong> ${mes}</span>
                    </div>

                    <table border="1" style="width:100%; border-collapse:collapse; margin-bottom: 40px;">
                        <tr style="background:#0f172a; color:white;">
                            <th style="padding:12px; text-align:left;">DESCRIÇÃO DO ITEM</th>
                            <th style="padding:12px; width:100px;">QUANT.</th>
                            <th style="padding:12px; text-align:left;">OBSERVAÇÃO</th>
                        </tr>`;
            
            let count = 0;
            listaInsumos.forEach(item => { 
                if(dados[item]) { 
                    html += `<tr>
                        <td style="padding:12px;">${item}</td>
                        <td style="padding:12px;" align="center"><strong>${dados[item].q}</strong></td>
                        <td style="padding:12px; font-size:11px;">${dados[item].o}</td>
                    </tr>`; 
                    count++; 
                } 
            });

            html += `</table>
                    <div style="margin-top:80px; display:flex; justify-content: space-around; text-align:center;">
                        <div style="width:250px; border-top: 1px solid #000; padding-top:10px;">Assinatura Responsável</div>
                        <div style="width:250px; border-top: 1px solid #000; padding-top:10px;">Data da Entrega</div>
                    </div>
                </div>`;

            const container = document.getElementById('pdf-container');
            container.innerHTML = count > 0 ? html : "<h3 style='text-align:center'>Nenhum dado registrado para esta unidade.</h3>";
            container.style.display = 'block';
            html2pdf().from(container).set({ margin: 15, filename: `Entrega_${local}_${mes}.pdf` }).save().then(() => container.style.display='none');
        }
    </script>
</body>
</html>
